description: >-
  Yale University is a private Ivy League research university in New Haven, Connecticut, United
  States, ranked #16 in the QS World University Rankings. Its programmable footprint is real but
  sharply bifurcated, and it is one of the few institutions in this cohort that operates its own
  contracts rather than only buying them. On the open side Yale runs LUX (lux.collections.yale.edu),
  a cross-collection discovery platform serving Linked Art JSON-LD over more than 41 million
  cultural-heritage records, built and published openly by Yale's own project-lux engineering
  organization; Yale Dataverse (dataverse.yale.edu), a self-hosted research-data repository on
  Yale's own AWS infrastructure minting DOIs under Yale's own DataCite prefix 10.60600; IIIF
  Presentation 3.0 manifests from Yale University Library Digital Collections; and a signed SAML 2.0
  Shibboleth identity-provider metadata document registered in InCommon. All four were probed live
  and answer anonymously.

  On the closed side, developers.yale.edu is a genuine institution-operated developer portal
  documenting eleven Enterprise (SOA) services and four Portal APIs — Buildings, Courses, Course
  Subjects, GatewayServiceMetrics — but Yale's own pages describe these as internal and private:
  the SOA tier uses basic authentication via a provisioned service account, and a Portal API key can
  only be requested by someone holding a valid Yale NetID. The gateway at gw.its.yale.edu is live and
  answers an anonymous call with "Invalid API Key", so the surface exists and is simply not open. An
  earlier profile of this repository described the Courses Web Service as returning "public
  information"; that is corrected here.

  Two further surfaces carry Yale's name but not Yale's engineering and are recorded as tenant
  relationships rather than as Yale contracts: EliScholar (elischolar.library.yale.edu), whose
  OAI-PMH endpoint is live but whose Identify response gives an Elsevier bepress Digital Commons
  admin contact, and the course catalog at courses.yale.edu / catalog.yale.edu, which is a Leepfrog
  CourseLeaf tenancy. Yale publishes no open-data portal, no llms.txt and no security.txt.
