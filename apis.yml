- aid: yale:elischolar
  name: EliScholar OAI-PMH (bepress Digital Commons tenancy)
  x-operator: tenant
  description: >-
    EliScholar is Yale's digital platform for scholarly publishing, and its OAI-PMH endpoint is live
    — Identify returned protocol version 2.0 with repositoryName "EliScholar – A Digital Platform for
    Scholarly Publishing at Yale" and an earliest datestamp of 2000-01-19, and ListSets enumerates
    Yale collections such as babylonian, arch2_theses and archipelagosjournal.

    RECORDED AS TENANT, NOT INSTITUTION. The host elischolar.library.yale.edu is a CNAME to
    dcyalelib.bepress.com, and the Identify response gives adminEmail dc-support@elsevier.com. The
    content, the collection policy and the institutional identity are Yale's; the protocol
    implementation and the operations are Elsevier's bepress Digital Commons. This is a real and
    valuable institutional fact — it is one of the few genuinely harvestable surfaces Yale's name
    sits on — so the relationship is recorded rather than deleted, and the vendor's generic contract
    is not saved under Yale's slug.
