---
aid: yale
name: Yale University
description: >-
  Yale University is a private Ivy League research university in New Haven,
  Connecticut, United States, ranked #17 in the QS World University Rankings
  2025. Its public developer footprint centers on the Yale API Portal
  (developers.yale.edu), which exposes enterprise (SOA) and portal APIs such as
  the Courses Web Service and Buildings service behind an API key gated to
  holders of a valid Yale netid. Yale also operates LUX, a large public
  cross-collection discovery platform built on Linked Art / IIIF that serves
  JSON-LD data and a search API across more than 41 million cultural-heritage
  records, and publishes IIIF manifests for its digital library collections.
  Source code for LUX and many library systems is openly available on GitHub.
