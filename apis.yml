apis:
  - aid: yale:courses
    name: Courses Web Service v3
    description: >-
      Returns public information for course offerings (course sections) for a
      given termCode and subjectCode, including titles, descriptions,
      instructors, meeting times, prerequisites and distributional designations.
      Responses are available in JSON or XML. Requires an API key obtained by
      registering an application in the Yale Developer Portal (Yale netid
      required).
    humanURL: https://developers.yale.edu/courseswebservicev3
    baseURL: https://gw.its.yale.edu/soa-gateway/courses/webservice/v3/index
    tags: [ Courses, Catalog, Education, SOA ]
    properties:
      - type: Documentation
        url: https://developers.yale.edu/courseswebservicev3
      - type: Signup
        url: https://developers.yale.edu/how-info/how-do-i-get-access-apis
  - aid: yale:portal
    name: Yale API Portal (Enterprise & Portal APIs)
    description: >-
      The Yale API Portal is the discovery hub for Yale's enterprise (SOA),
      portal and vendor/third-party APIs. Portal APIs include Buildings (name
      and location of Yale campus buildings), Courses, Course Subjects and
      GatewayServiceMetrics. Access to the developer portal and API keys is
      limited to individuals with a valid Yale netid.
    humanURL: https://developers.yale.edu/api-documentation
    tags: [ Catalog, Buildings, Enterprise, SOA, Education ]
    properties:
      - type: Documentation
        url: https://developers.yale.edu/api-documentation
      - type: DeveloperPortal
        url: https://developers.yale.edu/
      - type: Signup
        url: https://developers.yale.edu/how-info/how-do-i-get-access-apis
  - aid: yale:lux
    name: LUX Yale Collections Discovery API
    description: >-
      LUX is Yale's public cross-collection discovery platform providing unified
      access to more than 41 million records across Yale's museums, archives and
      library collections. Built on the Linked Art data model with IIIF, LUX
      serves entities as JSON-LD documents and exposes search and
      search-estimate endpoints. Implemented on a MarkLogic backend; the source
      code is open (Apache 2.0) under the project-lux GitHub organization.
    humanURL: https://lux.collections.yale.edu/content/technology
    baseURL: https://lux.collections.yale.edu/api
    tags: [ Cultural Heritage, Linked Data, Linked Art, IIIF, JSON-LD, Search ]
    properties:
      - type: Documentation
        url: https://lux.collections.yale.edu/content/technology
      - type: GitHub
        url: https://github.com/project-lux
      - type: SourceCode
        url: https://github.com/project-lux
      - type: OpenAPI
        url: openapi/yale-lux.yaml
      - type: x-json-schema
        url: json-schema/yale-orderedcollectionpage-schema.json
