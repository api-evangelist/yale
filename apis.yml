- aid: yale:dataverse
  name: Yale Dataverse Repository API
  x-operator: institution
  description: >-
    Yale University's institutional research-data repository, self-hosted on Yale's own AWS
    infrastructure under Yale's registrable domain, running open-source Dataverse 6.10.1 with 279
    published datasets across sub-dataverses including the ISPS Data Archive. Published content reads
    anonymously; deposit requires a NetID-bound API token. Yale mints DOIs under its own DataCite
    prefix 10.60600, and those DOIs resolve back to dataverse.yale.edu.

    OPERATOR NOTE. The Dataverse software generates a complete OpenAPI document at
    dataverse.yale.edu/openapi. That document is titled "Dataverse API", describes "Open source
    research data repository software", and is identical on every Dataverse installation worldwide —
    it is the software project's contract, not Yale's engineering, and it is deliberately not saved
    here. The contract in openapi/ describes only endpoints actually called against Yale's
    deployment, with Yale's server URL. Yale operates the deployment and owns the data; IQSS at
    Harvard authored the API design.
  humanURL: https://dataverse.yale.edu/
  baseURL: https://dataverse.yale.edu
