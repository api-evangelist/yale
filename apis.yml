  detail: >-
    Yale is not a thin profile. Four institution-operated surfaces were probed and answered
    anonymously — LUX search and configuration, the Yale Dataverse REST API, a Digital Collections
    IIIF Presentation 3.0 manifest, and the Shibboleth IdP SAML metadata — and each is described by
    a contract in openapi/ with its operator settled. Three limits on this coverage are recorded
    honestly rather than papered over. First, Yale's administrative estate (eleven Enterprise SOA
    services and four Portal APIs) is documented in public but gated behind a Yale NetID, so it is
    inventoried from Yale's own documentation and never described as callable. Second, the Blacklight
    JSON surface at collections.library.yale.edu/catalog.json returns an empty HTTP 202 edge
    challenge to automated requests even with a browser User-Agent, so it is recorded as blocked at
    the edge — a fact about our access, not about Yale. Third, LUX serves an identical 4200-byte
    single-page-app shell for every /content/ route including a deliberately nonsensical one, so LUX
    content pages cannot be graded by status code and are carried on the strength of the API's own
    declared contact URL plus the openly published project-lux source.
