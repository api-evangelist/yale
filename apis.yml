  - aid: yale:iiif
    name: Yale Digital Collections IIIF
    description: >-
      Yale University Library publishes International Image Interoperability
      Framework (IIIF) manifests for objects in its digital collections,
      enabling interoperable viewing and reuse of digitized images and metadata
