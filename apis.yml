- aid: yale:courses
  name: Courses Web Service v3
  description: >-
    Returns public information for course offerings (course sections) for a given termCode and subjectCode,
    including titles, descriptions, instructors, meeting times, prerequisites and distributional designations.
    Responses are available in JSON or XML. Requires an API key obtained by registering an application
    in the Yale Developer Portal (Yale netid required).
  humanURL: https://developers.yale.edu/courseswebservicev3
  baseURL: https://gw.its.yale.edu/soa-gateway/courses/webservice/v3/index
