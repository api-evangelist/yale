- aid: yale:identity-federation
  name: Yale University Identity Federation Metadata
  x-operator: institution
  description: >-
    Yale operates a Shibboleth Identity Provider at auth.yale.edu and publishes a signed SAML 2.0
    EntityDescriptor for entityID https://auth.yale.edu/idp/shibboleth, unauthenticated, declaring
    OrganizationName "Yale University", shibmd:Scope "yale.edu" and SingleSignOnService endpoints for
    the Shibboleth 1.0, SAML 1.1 and SAML 2.0 profiles. The same entity is registered in InCommon
    (registrationAuthority https://incommon.org) and retrievable from InCommon's per-entity metadata
    query service, which carries it into eduGAIN. The host resolves inside Yale's own AWS identity
    estate. This is not a REST API and was never meant to be one — it is catalogued because it is a
    verified, machine-readable, unambiguously institution-operated surface, and it is the artifact
    universities publish most consistently and catalog least often.
  humanURL: https://its.yale.edu/
  baseURL: https://auth.yale.edu
