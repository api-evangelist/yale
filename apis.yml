- aid: yale:portal
  name: Yale API Portal (Enterprise & Portal APIs)
  description: >-
    The Yale API Portal is the discovery hub for Yale's enterprise (SOA), portal and vendor/third-party
    APIs. Portal APIs include Buildings (name and location of Yale campus buildings), Courses, Course
    Subjects and GatewayServiceMetrics. Access to the developer portal and API keys is limited to individuals
    with a valid Yale netid.
