    Elsevier's bepress Digital Commons, running under Yale's name. Yale operates the collection
    policy; Elsevier operates the protocol endpoint. Recorded as tenant, not institution.
  artifact: examples/yale-elischolar-oaipmh-identify-example.xml
- standard: oai-pmh
  status: broken
  x-operator: institution
  evidence:
