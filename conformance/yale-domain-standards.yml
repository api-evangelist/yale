conformance:
- standard: shibboleth
  status: conformant
  x-operator: institution
  evidence:
    url: https://auth.yale.edu/idp/shibboleth
    status: 200
    content_type: application/xml;charset=UTF-8
    location: >-
      EntityDescriptor/@entityID = "https://auth.yale.edu/idp/shibboleth";
      IDPSSODescriptor/Extensions/shibmd:Scope = "yale.edu";
      protocolSupportEnumeration includes "urn:mace:shibboleth:1.0"
    note: >-
      Yale operates a Shibboleth Identity Provider and publishes its metadata unauthenticated. The
      host resolves to shibboleth-idp-prd.inbound.iam.aws.yale.edu, inside Yale's own AWS estate.
  artifact: openapi/yale-identity-federation-openapi.yml
- standard: saml
  status: conformant
  x-operator: institution
  evidence:
    url: https://mdq.incommon.org/entities/https%3A%2F%2Fauth.yale.edu%2Fidp%2Fshibboleth
    status: 200
    content_type: application/samlmetadata+xml
    location: >-
      EntityDescriptor/Extensions/mdrpi:RegistrationInfo/@registrationAuthority = "https://incommon.org";
      mdui:DisplayName = "Yale University";
      IDPSSODescriptor/SingleSignOnService bindings urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect,
      HTTP-POST and HTTP-POST-SimpleSign
    note: >-
      Yale's SAML 2.0 entity is registered in the InCommon federation and resolvable through its
