  artifact: openapi/yale-dataverse-openapi.yml
- standard: oai-pmh
  status: conformant
  x-operator: tenant
  evidence:
  - url: https://elischolar.library.yale.edu/do/oai/?verb=Identify
    status: 200
    content_type: text/xml
    location: >-
      OAI-PMH/Identify/repositoryName = "EliScholar – A Digital Platform for Scholarly Publishing
      at Yale"; protocolVersion 2.0; granularity YYYY-MM-DDThh:mm:ssZ; earliestDatestamp
      2000-01-19T00:00:00Z
  - url: https://elischolar.library.yale.edu/do/oai/?verb=ListSets
    status: 200
    location: setSpec values publication:applebaum_award, publication:arch2_theses, publication:babylonian, …
  note: >-
    CREDIT WITH CARE. The endpoint is on a Yale host, the repository name is Yale's and the content
    is Yale's — but the Identify response gives adminEmail dc-support@elsevier.com, and
