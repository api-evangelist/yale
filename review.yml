reviews:
  - date: '2026-06-03'
    rating: 4
    summary: >-
      Yale has a genuine, documented API surface. The Yale API Portal
      (developers.yale.edu, HTTP 200) catalogs enterprise/SOA and portal APIs
      including a documented Courses Web Service v3, Buildings, Course Subjects
      and GatewayServiceMetrics, but key issuance and portal access are gated to
      Yale netid holders, so endpoints cannot be exercised anonymously. The
      Courses base URL returned HTTP 400 without a valid apikey and required
      parameters, which is consistent with a live but authenticated gateway.
      The strongest public footprint is LUX (lux.collections.yale.edu), whose
      search and advanced-search-config API endpoints returned HTTP 200 and
      whose source is open under the project-lux GitHub org; some LUX data
      document endpoints returned transient 502/504 gateway errors at probe
      time. IIIF manifests for digital collections and library source code on
      GitHub are publicly available. No endpoints fabricated; all URLs below
      were probed live.
    endpoints:
