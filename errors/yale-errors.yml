description: >-
  Observed error semantics across Yale University's machine-readable surfaces. Yale has no single
  error contract — each surface carries the error idiom of the stack it is built on, and one of
  them is currently failing.
errors:
- surface: LUX Collections Discovery API
  base_url: https://lux.collections.yale.edu
  x-operator: institution
  media_type: application/json
  shape: '{"statusCode": <int>, "errorMessage": <string>}'
  observed:
  - request: GET /api/search-estimate/item?q=gold
    status: 400
    body: '{"statusCode":400,"errorMessage":"Document is not JSON"}'
    interpretation: >-
      The q parameter must be LUX JSON Grammar or String Grammar, not a bare keyword. The message
      is machine-stable and names the actual fault. Re-issued as
      q={"text":"gold"} the same endpoint returned 200 with totalItems 53387.
  assessment: >-
    Structured, JSON, specific. Good. Not documented in any published error table, and the status
    code is duplicated inside the body rather than described in the contract.
- surface: Yale Dataverse Repository API
  base_url: https://dataverse.yale.edu
  x-operator: institution
  media_type: application/json
  shape: '{"status": "ERROR", "message": <string>}'
  observed:
  - request: 'GET /api/info/settings/:DatasetPublishPopupCustomText'
    status: 404
    body: '{"status":"ERROR","message":"Setting :DatasetPublishPopupCustomText not found"}'
  - request: 'GET /api/datasets/export?exporter=schema.org&persistentId=doi:10.60600/QTNBFE'
