    status: 503
    body: 'Payara Server 7.2026.2 - Error report'
  - request: GET /oai?verb=ListMetadataFormats
    status: 503
    body: 'Payara Server 7.2026.2 - Error report'
  assessment: >-
    A LIVE DEFECT, recorded as such. The OAI-PMH harvesting endpoint is present and routed but the
